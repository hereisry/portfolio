<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- عشان الصفحة تتجاوب مع الجوال -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ryuof Alswoilm | Portfolio</title>


    <style>

        /* =====================================================
           إعدادات عامة
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
body {

    /* ألوان الوضع الأساسي */

    --bg-color: #8FAEAA;

    --text-color: #1B2927;

    --main-purple: #7669AD;

    --cyan: #8FD6D2;

    --purple: #8570F1;

    --green: #95E66D;

    --yellow: #E8F600;


    background:
        radial-gradient(
            circle at 18% 10%,
            rgba(151, 222, 218, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 40%,
            rgba(133, 112, 241, 0.10),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #8FAEAA 0%,
            #9DB7B3 55%,
            #89A7A3 100%
        );

    font-family: Arial, Helvetica, sans-serif;

    min-height: 100vh;

    overflow-x: hidden;

    transition:
        background 0.4s ease,
        color 0.4s ease;
}

        /* =====================================================
           الوضع الفاتح
           زر الوضع يبدّل بين الشكلين
        ===================================================== */
body:not(.light-mode) {

    --bg-color: #151B1B;

    --text-color: #97DEDA;

    --main-purple: #7669AD;

    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(151,222,218,0.05),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 40%,
            rgba(133,112,241,0.08),
            transparent 30%
        ),
        #151B1B;
}

        /* =====================================================
           الصفحة الرئيسية
        ===================================================== */

        .hero {

    position: relative;

    width: 100%;

    height: 100vh;

    min-height: 650px;

    overflow: hidden;

    background: transparent;
}

        /* =====================================================
           كلمة portfolio
        ===================================================== */

        .portfolio-label {

            position: absolute;

            top: 22px;
            left: 46px;

            color: var(--text-color);

            font-size: 13px;

            z-index: 20;
        }


        /* =====================================================
           زر Dark / Light Mode
        ===================================================== */

        .theme-toggle {

            position: absolute;

            top: 18px;
            right: 25px;

            width: 45px;
            height: 45px;

            border: none;

            border-radius: 50%;

            background: rgba(255,255,255,0.12);

            color: var(--text-color);

            font-size: 19px;

            cursor: pointer;

            z-index: 100;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        .theme-toggle:hover {

            transform: rotate(12deg) scale(1.08);

            background: rgba(255,255,255,0.22);
        }


        /* =====================================================
           النص الرئيسي
        ===================================================== */

        .intro {

            position: relative;

            z-index: 20;

            width: 100%;

            text-align: center;

            padding-top: 48px;
        }


        .intro h2 {

            color: var(--text-color);

            font-size: 26px;

            margin-bottom: 5px;
        }


        .intro h1 {

            color: var(--main-purple);

            font-size: 54px;

            line-height: 1.05;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .intro p {

            color: var(--text-color);

            font-size: 11px;

            margin-bottom: 10px;
        }


        /* =====================================================
           النجوم
        ===================================================== */

        .star {

            position: absolute;

            color: var(--text-color);

            line-height: 1;
        }


        .star-large {

            top: 48px;

            right: 20%;

            font-size: 52px;

            animation: starFloat 3s ease-in-out infinite;
        }


        .star-small {

            top: 175px;

            left: 34%;

            font-size: 27px;

            animation: starFloat 2.6s ease-in-out infinite;
        }


        @keyframes starFloat {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(7deg);
            }

        }


        /* =====================================================
           منطقة الملفات
        ===================================================== */

        .folders-area {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 58%;
        }


        /* =====================================================
           إعداد عام لكل ملف
        ===================================================== */

        .folder {

            position: absolute;

            cursor: pointer;

            transition:
                transform 0.35s cubic-bezier(.2,.8,.2,1),
                filter 0.35s ease;

            transform-origin: center bottom;
        }


        /* الملف يرتفع لما يجي المؤشر عليه */
        .folder:hover {

            transform: translateY(-25px);

            filter:
                drop-shadow(
                    0 15px 18px rgba(0,0,0,0.20)
                );
        }


        .folder:active {

            transform: translateY(-16px) scale(0.99);
        }


        /* =====================================================
           My Projects
        ===================================================== */

        .project-folder {

            z-index: 1;

            left: 9.8%;

            bottom: 77px;

            width: 81%;

            height: 190px;

            background: var(--cyan);

            clip-path: polygon(
                0 0,
                23% 0,
                31% 27%,
                100% 27%,
                100% 100%,
                0 100%
            );

            border-radius: 20px 0 0 0;
        }


        .project-folder span {

            position: absolute;

            top: 20px;
            left: 25px;

            font-size: 27px;

            font-weight: 700;

            color: #000;
        }


        /* =====================================================
           About Me
        ===================================================== */

        .about-folder {

            z-index: 3;

            left: 4.2%;

            bottom: 0;

            width: 92%;

            height: 183px;

            background: var(--purple);

            clip-path: polygon(
                0 29%,
                61% 29%,
                68% 0,
                97% 0,
                100% 10%,
                100% 100%,
                0 100%
            );

            border-radius: 0 20px 0 0;
        }


        .about-folder span {

            position: absolute;

            right: 9%;

            top: 25px;

            font-size: 27px;

            font-weight: 700;

            color: #000;
        }


        /* =====================================================
           Connect Me
        ===================================================== */

        .contact-folder {

            z-index: 5;

            left: 1.5%;

            bottom: -3px;

            width: 80%;

            height: 102px;

            background: var(--green);

            clip-path: polygon(
                0 0,
                27% 0,
                35% 49%,
                100% 49%,
                100% 100%,
                0 100%
            );

            border-radius: 19px 0 0 0;
        }


        .contact-folder span {

            position: absolute;

            top: 17px;
            left: 31px;

            font-size: 27px;

            font-weight: 700;

            color: #000;
        }


        /* =====================================================
           My Journey
           استخدمنا الملف الأصفر الصغير
        ===================================================== */

        .journey-folder {

            z-index: 8;

            right: 9.5%;

            bottom: -1px;

            width: 21%;

            height: 65px;

            background: var(--yellow);

            clip-path: polygon(
                10% 0,
                87% 0,
                100% 100%,
                0 100%
            );

            border-radius: 13px 13px 0 0;
        }


        .journey-folder span {

            position: absolute;

            width: 100%;

            text-align: center;

            top: 22px;

            font-size: 15px;

            font-weight: 700;

            color: #000;
        }


        /* =====================================================
           Responsive
        ===================================================== */

        @media (max-width: 800px) {

            .portfolio-label {
                left: 25px;
            }

            .intro {
                padding-top: 75px;
            }

            .intro h1 {
                font-size: 42px;
            }

            .intro h2 {
                font-size: 22px;
            }

            .intro p {

                width: 85%;

                margin-left: auto;
                margin-right: auto;

                line-height: 1.5;
            }

            .star-large {
                right: 8%;
            }

            .project-folder {

                width: 88%;

                left: 6%;
            }

            .about-folder {

                width: 94%;

                left: 3%;
            }

            .contact-folder {
                width: 84%;
            }

            .journey-folder {
                width: 27%;
            }

        }


        @media (max-width: 500px) {

            .hero {
                min-height: 700px;
            }

            .intro h1 {
                font-size: 35px;
            }

            .intro h2 {
                font-size: 19px;
            }

            .intro p {
                font-size: 10px;
            }

            .folders-area {
                height: 50%;
            }

            .project-folder span,
            .about-folder span,
            .contact-folder span {

                font-size: 20px;
            }

            .journey-folder span {

                top: 23px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<section class="hero">


    <!-- كلمة portfolio -->
    <div class="portfolio-label">
        portfolio
    </div>


    <!-- زر الوضع -->
    <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Change theme"
    >
        ☀️
    </button>


    <!-- النص الرئيسي -->
    <div class="intro">

        <h2>
            Hello, I’m
        </h2>

        <h1>
            Ryuof Alswoilm
        </h1>

        <p>
            I’m a passionate programming student interested in web development,
            databases, and UI/UX design.
        </p>

        <p>
            I love turning ideas into simple and useful solutions.
        </p>

    </div>


    <!-- النجوم -->
    <div class="star star-large">
        ☆
    </div>

    <div class="star star-small">
        ☆
    </div>


    <!-- الملفات -->
    <div class="folders-area">


        <!-- ملف المشاريع -->
        <div
            class="folder project-folder"
            onclick="goToPage('projects.html')"
        >

            <span>
                My project
            </span>

        </div>


        <!-- ملف About Me -->
        <div
            class="folder about-folder"
            onclick="goToPage('about.html')"
        >

            <span>
                about me
            </span>

        </div>


        <!-- ملف التواصل -->
        <div
            class="folder contact-folder"
            onclick="goToPage('contact.html')"
        >

            <span>
                conect me
            </span>

        </div>


        <!-- ملف الرحلة -->
        <div
            class="folder journey-folder"
            onclick="goToPage('journey.html')"
        >

            <span>
                My Journey
            </span>

        </div>


    </div>


</section>



<script>

    /* =====================================================
       الانتقال بين الصفحات
    ===================================================== */

    function goToPage(page) {

        window.location.href = page;

    }



    /* =====================================================
       Dark / Light Mode
    ===================================================== */

    const themeToggle =
        document.getElementById("themeToggle");


    /*
       نقرأ اختيار المستخدم السابق
       من localStorage
    */

    const savedTheme =
        localStorage.getItem("portfolioTheme");


    /*
       الموقع الأساسي عندنا Dark
       وإذا كان المستخدم اختار Light نفعله
    */

    if (savedTheme === "light") {

        document.body.classList.add("light-mode");

    }



    /* تغيير شكل الأيقونة */
    function updateThemeIcon() {

        if (
            document.body.classList.contains("light-mode")
        ) {

            themeToggle.textContent = "🌙";

        }

        else {

            themeToggle.textContent = "☀️";

        }

    }


    updateThemeIcon();



    /*
       عند الضغط على الزر
    */

    themeToggle.addEventListener(
        "click",
        function () {

            document.body.classList.toggle(
                "light-mode"
            );


            /*
               نتحقق هل الوضع الفاتح شغال
            */

            const lightModeActive =
                document.body.classList.contains(
                    "light-mode"
                );


            /*
               نحفظ الاختيار
            */

            localStorage.setItem(
                "portfolioTheme",
                lightModeActive
                    ? "light"
                    : "dark"
            );


            updateThemeIcon();

        }
    );

</script>


</body>

</html>
